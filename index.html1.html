<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>補給站｜團購登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B33; --navy2:#1B2A4D;
    --paper:#F0F3F2; --card:#FFFFFF;
    --lime:#C8F169; --lime-dark:#8FCB2E; --amber:#FFB627;
    --ink:#101B33; --ink-soft:#5B6478; --line:#DDE3E0; --danger:#E1543E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; padding-bottom:60px; }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.03em;}
  header.hero{
    background: radial-gradient(circle at 85% -10%, rgba(200,241,105,0.25), transparent 55%),
                linear-gradient(150deg, var(--navy) 0%, var(--navy2) 100%);
    color:#fff; padding:28px 20px 24px; position:relative; overflow:hidden;
  }
  header.hero::after{ content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%; background:rgba(200,241,105,0.10); }
  .bib{ display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
        padding:4px 10px; border-radius:999px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; color:var(--lime); margin-bottom:14px; }
  .bib::before{content:"●"; font-size:8px;}
  h1.display{ font-size:44px; line-height:0.95; margin:0 0 6px; color:#fff; }
  header.hero p{ margin:0; color:rgba(255,255,255,0.72); font-size:14px; max-width:34ch; }
  main{ padding:20px 16px 10px; max-width:640px; margin:0 auto; }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:18px; margin-bottom:16px; margin-top:16px;}
  .section-label{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:10px; display:block; }
  label.field-label{ display:block; font-weight:600; font-size:13px; margin:0 0 6px; color:var(--ink); }
  input[type=text], input[type=tel], input[type=number], select{
    width:100%; padding:12px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; font-family:'Inter',sans-serif; background:#fff; color:var(--ink);
  }
  input:focus, select:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(16,27,51,0.08); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field{ margin-bottom:14px; }
  .add-line{ display:flex; gap:8px; align-items:flex-end; margin-top:6px; }
  .qty-input{ width:64px; text-align:center; }
  button.btn{ border:none; border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; transition:transform .1s ease, opacity .15s ease; }
  button.btn:active{ transform:scale(0.97); }
  .btn-lime{ background:var(--lime); color:var(--navy); }
  .btn-navy{ background:var(--navy); color:#fff; width:100%; padding:15px; font-size:15px; }
  .btn-navy:disabled{ opacity:0.4; }
  .cart-line{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .cart-line:last-child{ border-bottom:none; }
  .cart-line .name{ font-weight:600; }
  .cart-line .meta{ color:var(--ink-soft); font-size:12px; }
  .cart-line .amt{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .remove-x{ background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:0 0 0 10px; }
  .total-bar{ display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff; border-radius:10px; padding:12px 14px; margin:14px 0; }
  .total-bar .num{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--lime); }
  .empty-note{ color:var(--ink-soft); font-size:13px; text-align:center; padding:14px 0; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 20px; border-radius:999px;
          font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:8px; z-index:50; opacity:0; pointer-events:none;
          transition:opacity .25s ease, transform .25s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .toast .dot{ width:7px; height:7px; border-radius:50%; background:var(--lime); }
  .gift-badge{ display:inline-block; margin-top:6px; background:#FFF3D6; color:#8A5A00; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
  .gift-badge.soft{ background:#EFF1EE; color:var(--ink-soft); }
  .setup-warning{ background:#FFF3D6; border:1px solid #F0D08A; color:#8A5A00; padding:12px 14px; border-radius:10px; font-size:12.5px; margin:0 16px 0; }
</style>
</head>
<body>

<header class="hero">
  <div class="bib">補給團購 · TEAM RESUPPLY</div>
  <h1 class="display">補給站登記表</h1>
  <p>選好品項、填上數量，一次送出。全團優惠與贈品資格，團媽會在試算表裡統一核對。</p>
</header>

<div id="setupWarning" class="setup-warning" style="display:none;">
  ⚠️ 尚未設定 Google Apps Script 網址。請開啟 index.html，把 <code>SCRIPT_URL</code> 換成你部署後拿到的網址（步驟見設定教學）。
</div>

<main>
  <div class="card">
    <span class="section-label">訂購人資料</span>
    <div class="row2">
      <div class="field">
        <label class="field-label">姓名 *</label>
        <input type="text" id="inpName" placeholder="王小美">
      </div>
      <div class="field">
        <label class="field-label">聯絡方式</label>
        <input type="tel" id="inpPhone" placeholder="0912-345-678">
      </div>
    </div>
  </div>

  <div class="card">
    <span class="section-label">加入品項</span>
    <div class="field" style="margin-bottom:10px;">
      <label class="field-label">選擇商品</label>
      <select id="inpItem"></select>
    </div>
    <div class="add-line">
      <div>
        <label class="field-label">數量</label>
        <input type="number" id="inpQty" class="qty-input" min="1" value="1">
      </div>
      <button class="btn btn-lime" id="btnAddLine" style="flex:1;">＋ 加入清單</button>
    </div>
  </div>

  <div class="card" id="cartCard">
    <span class="section-label">目前清單</span>
    <div id="cartLines"><div class="empty-note">還沒有加入任何品項</div></div>
    <div class="total-bar">
      <span>合計金額</span>
      <span class="num" id="cartTotal">$0</span>
    </div>
    <div id="giftHint"></div>
    <button class="btn btn-navy" id="btnSubmit" disabled>送出訂單</button>
  </div>
</main>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
/* =====================================================================
   ⬇⬇⬇ 唯一需要你手動修改的地方 ⬇⬇⬇
   把下面換成你部署 Google Apps Script 網頁應用程式後拿到的網址
   （設定步驟請看附上的「設定教學」）
   ===================================================================== */
const SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
/* ===================================================================== */

if(SCRIPT_URL.indexOf("PASTE_YOUR")===0){
  document.getElementById('setupWarning').style.display = 'block';
}

// ---------------- 品項資料 ----------------
const ITEMS = [
["Betery","能量果膠PRO(沙士)",600,"買就送沙士能量果膠1包；1~29盒$600，30盒以上95折$570（全團加總）"],
["Betery","能量果膠PRO(原味)",600,"買就送沙士能量果膠1包；1~29盒$600，30盒以上95折$570（全團加總）"],
["Betery","能量果膠PRO(葡萄柚)",600,"買就送沙士能量果膠1包；1~29盒$600，30盒以上95折$570（全團加總）"],
["Betery","耐力甜膠囊",340,"買就送體驗組(2顆)1組；1~19袋$340，20袋以上$320（全團加總）"],
["Betery","電解質膠囊(90顆/瓶)",600,""],
["Betery","酸櫻桃機能飲(9入/盒)",630,""],
["Betery","體保生運動益生菌(30入/盒)",799,""],
["Betery","血橙+鐵複方膠囊(60顆/包)",500,""],
["Betery","牛磺酸鎂膠囊(60顆/包)",500,""],
["Betery","高纖燕麥脆片(可可)",169,""],
["Betery","高纖燕麥脆片(芝麻)",169,""],
["Betery","高纖燕麥脆片(海苔)",169,""],
["鋭速運動醫學","鋅水動能電解質液",410,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","雙速咖啡因雙層錠",720,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","環原力酵素維生素C",550,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","雙螯合固鎂鈣",660,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","氧元速螯合鐵B群雙層錠",490,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","液態盾維生素D3",625,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","標沛益生菌",850,"滿1100元(鋭速商品加總,可累贈)送爆汗神補給包1盒"],
["鋭速運動醫學","洗沐3合1(420ml)【加價購】",390,"限加價購，需併其他鋭速商品"],
["UP","FAST能量果膠(A檸檬萊姆)",49,""],
["UP","FAST能量果膠(B海鹽莓果)",49,""],
["UP","FAST能量果膠(C水蜜桃)",49,""],
["UP","FAST/FAST-X能量果膠(O酸櫻桃汁)",59,""],
["UP","FAST/FAST-X能量果膠(P洛神烏梅)",59,""],
["UP","FAST/FAST-X能量果膠(Z沁涼藍莓)",59,""],
["UP","咖啡因能量棒(D香蕉可可)",55,""],
["UP","咖啡因能量棒(E鳳梨可可)",55,""],
["UP","咖啡因能量棒(O芒果可可)",65,""],
["UP","RC膠囊(F)",850,""],
["UP","電解力(G)",450,""],
["UP","運動魚油(H)",850,""],
["UP","UP O2膠囊(I)",1150,""],
["UP","運動保護膠囊(J)",950,""],
["UP","牛磺酸膠囊(K)",520,""],
["UP","綠茶咖啡因膠囊(L)",620,""],
["UP","微鐵膠囊(X)",780,""],
["UP","UP電解力Plus+(W)",630,""],
["UP","UP膠囊收納盒(M)",60,""],
["UP","FOCHEWS能量軟糖(N多多風味)",43,""],
["UP","FOCHEWS能量軟糖(V芒果風味)",43,""],
["黃金甲","白藜蘆醇",1720,""],
["黃金甲","葉黃素",990,""],
["黃金甲","太空能量膠(10包/盒)",550,""],
["黃金甲","Ultra能量膠(10包/盒)",700,""],
["黃金甲","太空能量膠MAX 小金膠(10包/盒)",600,""],
["黃金甲","睿智膏",1330,""],
["黃金甲","力捷凍",1650,""],
["黃金甲","全潤",1720,""],
["黃金甲","維生素",820,""],
["黃金甲","活力定",1880,"原價$2,380"],
["黃金甲","遠見眼科聯名｜ULTRA金盞花葉黃素飲",1060,"原價$1,280"],
].map(([brand,name,price,note])=>({brand,name,price,note}));

let cart = [];

const selItem = document.getElementById('inpItem');
[...new Set(ITEMS.map(i=>i.brand))].forEach(brand=>{
  const og = document.createElement('optgroup');
  og.label = brand;
  ITEMS.forEach((it, idx)=>{
    if(it.brand!==brand) return;
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${it.name} － $${it.price}`;
    og.appendChild(opt);
  });
  selItem.appendChild(og);
});

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function renderCart(){
  const area = document.getElementById('cartLines');
  const totalEl = document.getElementById('cartTotal');
  const btnSubmit = document.getElementById('btnSubmit');
  const giftHint = document.getElementById('giftHint');

  if(cart.length===0){
    area.innerHTML = '<div class="empty-note">還沒有加入任何品項</div>';
    totalEl.textContent = '$0';
    btnSubmit.disabled = true;
    giftHint.innerHTML = '';
    return;
  }
  area.innerHTML = cart.map((line, idx)=>`
    <div class="cart-line">
      <div>
        <div class="name">${line.name}</div>
        <div class="meta">${line.brand} · 數量 ${line.qty} × $${line.price}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="amt">$${(line.qty*line.price).toLocaleString()}</span>
        <button class="remove-x" data-idx="${idx}">✕</button>
      </div>
    </div>`).join('');
  area.querySelectorAll('.remove-x').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(+btn.dataset.idx,1); renderCart(); };
  });

  const total = cart.reduce((s,l)=>s+l.qty*l.price,0);
  totalEl.textContent = '$'+total.toLocaleString();
  btnSubmit.disabled = document.getElementById('inpName').value.trim()==='';

  const rzTotal = cart.filter(l=>l.brand==='鋭速運動醫學').reduce((s,l)=>s+l.qty*l.price,0);
  if(rzTotal>0){
    giftHint.innerHTML = rzTotal>=1100
      ? `<div class="gift-badge">🎁 鋭速商品已滿 $1,100，符合贈品資格（送爆汗神補給包1盒）</div>`
      : `<div class="gift-badge soft">鋭速商品目前 $${rzTotal}，再買 $${1100-rzTotal} 即可獲贈爆汗神補給包</div>`;
  } else {
    giftHint.innerHTML = '';
  }
}

document.getElementById('btnAddLine').onclick = ()=>{
  const idx = +selItem.value;
  const qty = Math.max(1, parseInt(document.getElementById('inpQty').value)||1);
  const it = ITEMS[idx];
  const existing = cart.find(l=>l.name===it.name);
  if(existing){ existing.qty += qty; } else { cart.push({brand:it.brand, name:it.name, price:it.price, qty}); }
  renderCart();
  document.getElementById('inpQty').value = 1;
};

document.getElementById('inpName').addEventListener('input', renderCart);

document.getElementById('btnSubmit').onclick = async ()=>{
  const name = document.getElementById('inpName').value.trim();
  const phone = document.getElementById('inpPhone').value.trim();
  if(!name || cart.length===0) return;
  if(SCRIPT_URL.indexOf("PASTE_YOUR")===0){
    showToast('⚠️ 尚未設定 Google 試算表網址');
    return;
  }

  const payload = {
    name, phone,
    lines: cart.map(l=>({brand:l.brand, name:l.name, price:l.price, qty:l.qty})),
    total: cart.reduce((s,l)=>s+l.qty*l.price,0),
    createdAt: new Date().toISOString()
  };

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = '送出中…';
  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免觸發CORS預檢
      body: JSON.stringify(payload)
    });
    showToast('✅ 訂單已送出，謝謝！');
    cart = [];
    document.getElementById('inpName').value = '';
    document.getElementById('inpPhone').value = '';
    renderCart();
  }catch(e){
    console.error(e);
    showToast('❌ 送出失敗，請確認網路或稍後再試');
  }
  btn.textContent = '送出訂單';
  btn.disabled = document.getElementById('inpName').value.trim()==='';
};

renderCart();
</script>
</body>
</html>
